name: Render Hybrid Facts Video

on:
  workflow_dispatch:
    inputs:
      project_json:
        description: "Optional complete project JSON; leave empty to read daily-news/current/project.json"
        required: false
        type: string
        default: ""
      voice_gender:
        description: "Hindi narration voice"
        required: true
        type: choice
        options:
          - male
          - female
        default: male
      output_name:
        description: "Output MP4 filename"
        required: true
        type: string
        default: hindi-news-bulletin.mp4

permissions:
  contents: read

concurrency:
  group: hybrid-video-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Write project manifest
        env:
          PROJECT_JSON: ${{ inputs.project_json }}
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = os.environ.get("PROJECT_JSON", "").strip()
          if raw:
              project = json.loads(raw)
          else:
              manifest_path = Path("daily-news/current/project.json")
              if not manifest_path.is_file():
                  raise SystemExit(
                      "No project_json input and daily-news/current/project.json is missing"
                  )
              project = json.loads(manifest_path.read_text(encoding="utf-8"))

          Path("output/project.json").write_text(
              json.dumps(project, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Copy editorial provenance records
        run: |
          for file in sources.json asset_licenses.json editorial_checklist.json; do
            source="daily-news/current/$file"
            if [ -f "$source" ]; then
              cp "$source" "output/$file"
            fi
          done

      - name: Render hybrid video
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          VOICE_GENDER: ${{ inputs.voice_gender }}
        run: |
          case "$OUTPUT_NAME" in
            ""|*[!A-Za-z0-9._-]* ) echo "Invalid output filename"; exit 1 ;;
          esac
          case "$OUTPUT_NAME" in
            *.mp4) ;;
            *) echo "Output filename must end in .mp4"; exit 1 ;;
          esac
          python -m engine.hybrid_renderer \
            --project output/project.json \
            --output "output/$OUTPUT_NAME" \
            --voice-gender "$VOICE_GENDER"

      - name: Verify output
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          test -s "output/$OUTPUT_NAME"
          test -s output/credits.txt
          test -s "output/${OUTPUT_NAME%.mp4}.srt"
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "output/$OUTPUT_NAME"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 "output/$OUTPUT_NAME")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 "output/$OUTPUT_NAME")"
          test "$width" = "1920"
          test "$height" = "1080"

      - name: Upload video and production records
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-facts-video
          path: |
            output/*.mp4
            output/*.srt
            output/credits.txt
            output/project.json
            output/sources.json
            output/asset_licenses.json
            output/editorial_checklist.json
          if-no-files-found: error
          retention-days: 7

name: Render Hybrid Facts Video

on:
  workflow_dispatch:
    inputs:
      project_json:
        description: "Optional complete project JSON; leave empty to read daily-news/current/project.json"
        required: false
        type: string
        default: ""
      voice_gender:
        description: "Hindi narration voice"
        required: true
        type: choice
        options:
          - male
          - female
        default: male
      output_name:
        description: "Output MP4 filename"
        required: true
        type: string
        default: hindi-news-bulletin.mp4

permissions:
  contents: read

concurrency:
  group: hybrid-video-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg, Hindi phonemizer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Write project manifest
        env:
          PROJECT_JSON: ${{ inputs.project_json }}
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = os.environ.get("PROJECT_JSON", "").strip()
          if raw:
              project = json.loads(raw)
          else:
              manifest_path = Path("daily-news/current/project.json")
              if not manifest_path.is_file():
                  raise SystemExit(
                      "No project_json input and daily-news/current/project.json is missing"
                  )
              project = json.loads(manifest_path.read_text(encoding="utf-8"))

          Path("output/project.json").write_text(
              json.dumps(project, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Copy editorial provenance records
        run: |
          for file in sources.json asset_licenses.json editorial_checklist.json; do
            source="daily-news/current/$file"
            if [ -f "$source" ]; then
              cp "$source" "output/$file"
            fi
          done
          test -s output/sources.json
          test -s output/asset_licenses.json
          test -s output/editorial_checklist.json

      - name: Validate provenance and editorial gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sources = json.loads(Path("output/sources.json").read_text(encoding="utf-8"))
          assets = json.loads(Path("output/asset_licenses.json").read_text(encoding="utf-8"))
          checklist = json.loads(Path("output/editorial_checklist.json").read_text(encoding="utf-8"))
          source_fields = {"publisher", "title", "url", "published_at", "accessed_at", "claims_supported", "source_type", "verification_notes"}
          source_types = {"primary", "official", "news", "research", "other"}
          if not isinstance(sources.get("sources"), list) or not sources["sources"]:
              raise SystemExit("BLOCKED: sources.json has no source records")
          for item in sources["sources"]:
              missing = source_fields - set(item)
              if missing:
                  raise SystemExit(f"BLOCKED: source {item.get('id')} missing {sorted(missing)}")
              if item["source_type"] not in source_types:
                  raise SystemExit(f"BLOCKED: source {item.get('id')} has invalid source_type")
              if not str(item["url"]).startswith("https://"):
                  raise SystemExit(f"BLOCKED: source {item.get('id')} URL is not HTTPS")
          asset_fields = {"asset_id", "asset_type", "asset_page_url", "download_url", "creator", "rights_holder", "license_name_and_version", "commercial_use_allowed", "adaptation_allowed", "attribution_required", "required_attribution_text", "evidence_location", "checked_at"}
          if not isinstance(assets.get("assets"), list) or not assets["assets"]:
              raise SystemExit("BLOCKED: asset_licenses.json has no asset records")
          for item in assets["assets"]:
              missing = asset_fields - set(item)
              if missing:
                  raise SystemExit(f"BLOCKED: asset {item.get('asset_id')} missing {sorted(missing)}")
              if item["commercial_use_allowed"] is not True or item["adaptation_allowed"] is not True:
                  raise SystemExit(f"BLOCKED: asset {item.get('asset_id')} lacks commercial/adaptation permission")
              if not str(item["asset_page_url"]).startswith("https://") or not str(item["evidence_location"]).startswith("https://"):
                  raise SystemExit(f"BLOCKED: asset {item.get('asset_id')} lacks HTTPS evidence")
              licence = str(item["license_name_and_version"]).lower()
              if any(x in licence for x in ("noncommercial", "non-commercial", "no derivatives", "no-derivatives")):
                  raise SystemExit(f"BLOCKED: prohibited licence on {item.get('asset_id')}")
              if not str(item["required_attribution_text"]).strip():
                  raise SystemExit(f"BLOCKED: asset {item.get('asset_id')} has no attribution text")
          project = json.loads(Path("output/project.json").read_text(encoding="utf-8"))
          asset_ids = {x["asset_id"] for x in assets["assets"]}
          for index, scene in enumerate(project.get("scenes", []), 1):
              if scene.get("asset_id") not in asset_ids:
                  raise SystemExit(f"BLOCKED: scene {index} has no matching asset licence record")
              if not scene.get("license_url"):
                  raise SystemExit(f"BLOCKED: scene {index} has no licence URL")
          approval = checklist.get("final_approval_status")
          if approval not in {"PASS", "HOLD", "BLOCKED"}:
              raise SystemExit("BLOCKED: editorial checklist has no valid final approval status")
          if approval == "BLOCKED":
              raise SystemExit("BLOCKED: editorial checklist explicitly blocks this video")
          if approval == "HOLD":
              print("HOLD: draft rendering allowed for review only; publication remains blocked.")
          print("Provenance validation passed.")
          PY

      - name: Render hybrid video
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          VOICE_GENDER: ${{ inputs.voice_gender }}
        run: |
          case "$OUTPUT_NAME" in
            ""|*[!A-Za-z0-9._-]* ) echo "Invalid output filename"; exit 1 ;;
          esac
          case "$OUTPUT_NAME" in
            *.mp4) ;;
            *) echo "Output filename must end in .mp4"; exit 1 ;;
          esac
          python -m engine.hybrid_renderer \
            --project output/project.json \
            --output "output/$OUTPUT_NAME" \
            --voice-gender "$VOICE_GENDER"

      - name: Verify output
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          test -s "output/$OUTPUT_NAME"
          test -s output/credits.txt
          test -s "output/${OUTPUT_NAME%.mp4}.srt"
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "output/$OUTPUT_NAME"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 "output/$OUTPUT_NAME")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 "output/$OUTPUT_NAME")"
          test "$width" = "1920"
          test "$height" = "1080"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output/$OUTPUT_NAME")"
          python -c 'import sys; d=float(sys.argv[1]); assert 540 <= d <= 660, f"Expected 9–11 min video, got {d:.1f}s"' "$duration"
          audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=s=x:p=0 "output/$OUTPUT_NAME")"
          test -n "$audio"
          test -s "output/${OUTPUT_NAME%.mp4}.srt"

      - name: Upload video and production records
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-facts-video
          path: |
            output/*.mp4
            output/*.srt
            output/credits.txt
            output/project.json
            output/sources.json
            output/asset_licenses.json
            output/editorial_checklist.json
          if-no-files-found: error
          retention-days: 7

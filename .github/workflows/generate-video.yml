name: Generate Short Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Video title"
        required: true
        type: string
        default: "भारतीय संविधान की प्रस्तावना"
      narration:
        description: "Narration script (a few short sentences)"
        required: true
        type: string
        default: "भारतीय संविधान की प्रस्तावना हमारे लोकतंत्र की आत्मा है। यह भारत को लोकतंत्रात्मक गणराज्य घोषित करती है। प्रस्तावना न्याय, स्वतंत्रता, समानता और बंधुता के आदर्शों को स्थापित करती है।"
      language:
        description: "Narration language"
        required: true
        type: choice
        options:
          - hi
          - en
        default: hi
      template:
        description: "Visual design template"
        required: true
        type: choice
        options:
          - educational
          - cinematic
          - news
          - facts
          - quote
        default: educational
      voice_gender:
        description: "Neural narration voice"
        required: true
        type: choice
        options:
          - female
          - male
        default: female
      visual_query:
        description: "Optional Wikimedia Commons background search (leave empty for generated graphics)"
        required: false
        type: string
        default: ""
      duration:
        description: "Video duration in seconds (15 to 60)"
        required: true
        type: choice
        options:
          - "15"
          - "20"
          - "30"
          - "40"
          - "45"
          - "60"
        default: "30"

permissions:
  contents: read

concurrency:
  group: video-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render vertical short
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloud rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Render MP4
        env:
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_NARRATION: ${{ inputs.narration }}
          VIDEO_LANGUAGE: ${{ inputs.language }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TEMPLATE: ${{ inputs.template }}
          VIDEO_VOICE_GENDER: ${{ inputs.voice_gender }}
          VIDEO_VISUAL_QUERY: ${{ inputs.visual_query }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os
          from pathlib import Path
          from engine.render_video import render

          title = os.environ["VIDEO_TITLE"].strip()
          narration = os.environ["VIDEO_NARRATION"].strip()
          language = os.environ["VIDEO_LANGUAGE"]
          duration = int(os.environ["VIDEO_DURATION"])
          template = os.environ["VIDEO_TEMPLATE"]
          voice_gender = os.environ["VIDEO_VOICE_GENDER"]
          visual_query = os.environ.get("VIDEO_VISUAL_QUERY", "").strip()
          if not title or not narration:
              raise SystemExit("Title and narration cannot be empty")
          render(
              title, narration, language, duration,
              Path("output/video-factory-short.mp4"),
              template=template,
              visual_query=visual_query,
              voice_gender=voice_gender,
          )
          PY

      - name: Verify MP4 and captions
        run: |
          test -s output/video-factory-short.mp4
          test -s output/video-factory-short.srt
          test -s output/credits.txt
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/video-factory-short.mp4
          frames="$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=noprint_wrappers=1:nokey=1 output/video-factory-short.mp4)"
          test "$frames" -ge 450

      - name: Upload finished video and companion files
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-output
          path: output/*
          if-no-files-found: error
          retention-days: 7
